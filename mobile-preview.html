<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 화면 확인 (임시)</title>
<style>
  html, body { margin: 0; height: 100%; background: #e8eef7; }
  body { display: grid; place-items: center; font-family: -apple-system, sans-serif; }
  .phone {
    width: 390px; height: 844px; border-radius: 40px; overflow: hidden;
    background: #fff; box-shadow: 0 24px 70px rgba(15, 23, 42, .28);
    border: 8px solid #0f172a;
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <div class="phone"><iframe src="./index.html?mobile=1" allow="geolocation" title="모바일 화면"></iframe></div>
</body>
</html>
