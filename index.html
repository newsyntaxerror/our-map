<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리끼리 — 지인 전용 위치 공유</title>
<meta name="description" content="광고 없이 친구·가족끼리만 쓰는 초대 코드 위치 공유 웹앱">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0fb9a3">
<meta property="og:type" content="website">
<meta property="og:title" content="우리끼리 — 지인 전용 위치 공유">
<meta property="og:description" content="광고 없이 친구·가족끼리만 쓰는 초대 코드 위치 공유 웹앱">
<meta property="og:image" content="./preview.png">
<meta name="twitter:card" content="summary_large_image">

<!-- iOS 사파리 '홈 화면에 추가' -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="우리끼리">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="./styles.css">
<script>
  /* 화면 확인용: 콘솔 에러를 남겨 두면 개발자도구 없이도 읽을 수 있습니다. */
  window.__ERRORS__ = [];
  addEventListener('error', function (e) { window.__ERRORS__.push(String(e.message || e.error)); });
  addEventListener('unhandledrejection', function (e) { window.__ERRORS__.push('promise: ' + String(e.reason)); });
</script>
</head>
<body>

<!-- ───────────── 입장 화면 ───────────── -->
<div class="join" id="joinScreen">
  <div class="join-glow join-glow--a"></div>
  <div class="join-glow join-glow--b"></div>

  <div class="join-inner">
    <header class="join-head">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 3.5c-4.7 0-8.5 3.8-8.5 8.5 0 6.1 7.3 15.1 7.6 15.5a1.2 1.2 0 0 0 1.8 0c.3-.4 7.6-9.4 7.6-15.5 0-4.7-3.8-8.5-8.5-8.5Z" fill="#fff"/>
          <circle cx="16" cy="11.8" r="3.1" fill="#0fb9a3"/>
        </svg>
      </div>
      <h1>우리끼리</h1>
      <p class="join-sub">광고 없는, 지인 전용 위치 공유</p>
    </header>

    <form class="join-card" id="joinForm" novalidate>
      <label class="field">
        <span class="field-label">내 닉네임</span>
        <input id="inputNick" class="field-input" type="text" maxlength="12" placeholder="예: 달콩"
               autocomplete="nickname" enterkeyhint="next" required>
      </label>

      <label class="field">
        <span class="field-label">방 코드 <em>초대받은 코드</em></span>
        <input id="inputRoom" class="field-input field-input--code" type="text" maxlength="20"
               placeholder="예: DALKONG-01" autocapitalize="characters" autocomplete="off"
               spellcheck="false" enterkeyhint="go">
      </label>

      <button class="btn btn--primary" id="btnJoin" type="submit">방 들어가기</button>

      <div class="or"><span>방이 없나요?</span></div>

      <button class="btn btn--ghost" id="btnCreate" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        새 방 코드 만들기
      </button>
      <p class="tiny" id="joinHint">새 방을 만들면 친구에게 보낼 링크가 바로 생겨요.</p>
    </form>

    <p class="mode-note" id="modeNote" hidden>
      <span class="mode-dot"></span><b>체험 모드</b> — 친구 2명이 미리 들어와 있어요
    </p>

    <p class="privacy-note">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.8 5 6.6v5.1c0 4.2 2.9 7.4 7 8.5 4.1-1.1 7-4.3 7-8.5V6.6L12 3.8Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m9.3 12 1.9 1.9 3.6-3.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      위치는 같은 방 사람에게만 보여요 · 광고·추적 없음
    </p>

    <p class="install-note">아이폰은 사파리 <b>공유 → 홈 화면에 추가</b>로 앱처럼 쓸 수 있어요.</p>
  </div>
</div>

<!-- ───────────── 메인 지도 화면 ───────────── -->
<main class="app" id="app" hidden>
  <div class="map" id="map"></div>

  <header class="topbar">
    <div class="room-chip" id="roomChip" title="방 코드 복사">
      <span class="room-pin" aria-hidden="true">📍</span>
      <span class="room-meta">
        <span class="room-code" id="roomCodeLabel">—</span>
        <span class="room-count" id="roomCountLabel">0명</span>
      </span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btnShare" type="button" aria-label="방 링크 보내기" title="방 링크 보내기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 14v4.2c0 .9.7 1.6 1.6 1.6h10.8c.9 0 1.6-.7 1.6-1.6V14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="btnLeave" type="button" aria-label="방 나가기" title="방 나가기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5H6.6C5.7 5 5 5.7 5 6.6v10.8c0 .9.7 1.6 1.6 1.6H14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M17 8.5 20.5 12 17 15.5M10.5 12h10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>


  <section class="sheet" id="sheet">
    <button class="sheet-grip" id="btnCollapse" type="button" aria-label="멤버 목록 접기/펼치기"></button>

    <div class="sheet-head">
      <h2 class="sheet-title">우리 방 <span class="count" id="sheetCount">0</span></h2>
      <div class="sheet-head-actions">
        <button class="sheet-more sheet-more--plain" id="btnLocate" type="button" aria-label="내 위치로 이동">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1" fill="currentColor"/><circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.7v2M12 19.3v2M2.7 12h2M19.3 12h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          내 위치
        </button>
        <button class="sheet-more" id="btnInvite" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19.5v-1.6c0-2-1.7-3.6-3.7-3.6H6.8c-2 0-3.7 1.6-3.7 3.6v1.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="9" cy="7.3" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M18.4 8.2v5.6M15.6 11h5.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          친구 초대
        </button>
      </div>
    </div>

    <div class="members" id="memberList"></div>

    <div class="controls">
      <button class="btn-update" id="btnUpdate" type="button">
        <span class="btn-update-main">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1" fill="currentColor"/><circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          내 위치 업데이트
        </span>
        <span class="btn-update-sub" id="updateSub">방금 전</span>
      </button>

      <div class="toggle-row">
        <button class="chip-toggle is-on" id="btnAuto" type="button" aria-pressed="true">
          <span class="chip-led"></span>자동 갱신
        </button>
        <button class="chip-toggle" id="btnCopy" type="button">
          <span class="chip-ico" aria-hidden="true">🔗</span>링크 복사
        </button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 멤버 상세 · 동선 -->
  <div class="modal" id="memberModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" id="mCard" role="dialog" aria-modal="true" aria-labelledby="mName">
      <div class="modal-grip"></div>
      <div class="modal-person">
        <span class="modal-avatar" id="mAvatar">?</span>
        <div class="modal-person-text">
          <h3 id="mName">—</h3>
          <p id="mStatus">—</p>
        </div>
      </div>

      <!-- 동선 · 장소별 머문 시간 -->
      <section class="route-block" id="mRouteBlock">
        <div class="route-head">
          <span class="route-title">동선 · 머문 곳</span>
          <button class="route-toggle is-on" id="mRouteToggle" type="button">경로 숨기기</button>
        </div>
        <p class="route-sum" id="mRouteSum">이동 기록을 불러오는 중…</p>
        <ol class="timeline" id="mTimeline"></ol>
      </section>

      <dl class="modal-rows" id="mRows"></dl>

      <div class="modal-edit" id="mEdit" hidden>
        <span class="field-label">내 상태</span>
        <div class="emoji-row" id="mEmojis"></div>
        <input class="field-input" id="mStatusInput" type="text" maxlength="24" placeholder="한 줄 상태 (예: 퇴근길이에요)">

        <div class="batt-edit" id="mBatt" hidden>
          <span class="field-label">배터리 표시 <em>이 브라우저는 배터리 정보를 막고 있어요</em></span>
          <div class="seg" id="mBattModes">
            <button type="button" data-mode="off" class="is-on">표시 안 함</button>
            <button type="button" data-mode="manual">직접 입력</button>
          </div>
          <div class="batt-manual" id="mBattManual" hidden>
            <div class="batt-line">
              <input id="mBattRange" type="range" min="0" max="100" step="1" value="80">
              <output id="mBattVal">80%</output>
            </div>
            <label class="batt-charge"><input id="mBattCharging" type="checkbox"> ⚡ 충전 중</label>
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn--ghost" id="mClose" type="button">닫기</button>
        <button class="btn btn--primary" id="mSave" type="button" hidden>상태 저장</button>
        <button class="btn btn--primary" id="mLocate" type="button" hidden>지도에서 보기</button>
      </div>
    </div>
  </div>

  <div class="permission-hint" id="permHint" hidden>
    <span>📍 위치 권한을 허용하면 내 실제 위치가 표시돼요.</span>
    <button id="btnPermAsk" type="button">권한 요청</button>
    <button id="btnPermClose" type="button" aria-label="닫기">✕</button>
  </div>
</main>

<script src="./vendor/leaflet/leaflet.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
